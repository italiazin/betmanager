<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Criar Conta</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="auth-page">
<div class="auth-card">
    <h1>Criar conta</h1>
    <p>Crie seu acesso ao Bet Manager.</p>
    {% if erro %}<div class="auth-error">{{ erro }}</div>{% endif %}
    <form method="POST" class="auth-form">
        <input name="nome" placeholder="Nome" required>
        <input name="email" type="email" placeholder="E-mail" required>
        <input name="senha" type="password" placeholder="Senha" required>
        <button type="submit">Criar conta</button>
    </form>
    <p style="margin-top:16px;">Já tem conta? <a class="auth-link" href="/login">Entrar</a></p>
</div>
</body></html>
