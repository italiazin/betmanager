<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Login</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="auth-page">
<div class="auth-card">
    <h1>🎯 Bet Manager</h1>
    <p>Entre para acessar seu painel de gestão de apostas.</p>
    {% if erro %}<div class="auth-error">{{ erro }}</div>{% endif %}
    <form method="POST" class="auth-form" id="loginForm">
        <input name="email" type="email" placeholder="E-mail" required>
        <input name="senha" type="password" placeholder="Senha" required>
        <button type="submit" id="loginBtn">Entrar</button>
    </form>
    <p style="margin-top:16px;">Não tem conta? <a class="auth-link" href="/criar-conta">Criar conta</a></p>
</div>

<script>
document.getElementById("loginForm")?.addEventListener("submit", ()=>{
    const btn = document.getElementById("loginBtn")
    if(btn){
        btn.disabled = true
        btn.innerText = "Entrando..."
    }
})
</script>
</body></html>
